name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS, MSI)
            os: windows-latest
            bundles: nsis,msi
            artifact: windows
          - name: macOS (DMG)
            os: macos-latest
            bundles: dmg
            artifact: macos
          - name: Linux x64 (AppImage, DEB, RPM)
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev patchelf libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev libdbus-1-dev rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --bundles "${{ matrix.bundles }}" 2>&1 | tee tauri-build.log

      - name: Report build diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f tauri-build.log ]]; then
            echo '### Build diagnostics (last 100 lines)' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 tauri-build.log >> "$GITHUB_STEP_SUMMARY"
            details="$(grep -E 'error:|Error:|Caused by:|failed to|Failed to' tauri-build.log | tail -n 30 | tr '\n' ' ')"
            if [[ -n "$details" ]]; then
              printf '::error title=Build diagnostics::%s\n' "$details"
            fi
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: badelha-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            !src-tauri/target/release/bundle/**/.*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages from all platforms
        uses: actions/download-artifact@v4
        with:
          pattern: badelha-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Badelha ${{ github.ref_name }} / بدّلها
          body_path: .github/release_template.md
          files: release-assets/**/*
